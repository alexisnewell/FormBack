name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend
      - name: Assemble downloadable bundle
        run: |
          mkdir -p formback/frontend
          cp -r api src models THIRD_PARTY_LICENSES requirements.txt NOTICE start.sh start.bat README.md formback/
          cp -r frontend/dist formback/frontend/dist
          chmod +x formback/start.sh
          zip -r "formback-${GITHUB_REF_NAME}.zip" formback -x '*/__pycache__/*'
      - uses: softprops/action-gh-release@v2
        with:
          files: formback-*.zip
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
